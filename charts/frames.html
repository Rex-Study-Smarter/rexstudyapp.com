<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frame Player</title>
<style>
  :root { --accent:#72A07D; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#fff;color:#111;display:flex;flex-direction:column;
    justify-content:center;gap:10px;padding:18px;-webkit-user-select:none;user-select:none;
  }
  h1{font-size:1.05rem;color:var(--accent);text-align:center}
  .stage{
    background:rgba(114,160,125,.10);border:1px solid rgba(114,160,125,.35);
    border-radius:16px;padding:12px;
  }
  .stage svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px}
  .cap{
    font-size:.9rem;font-weight:600;text-align:center;min-height:3.2em;
    display:flex;align-items:center;justify-content:center;padding:10px 4px 0;
  }
  .track{display:flex;gap:5px;margin-top:10px}
  .track i{flex:1;height:4px;border-radius:2px;background:rgba(114,160,125,.25);cursor:pointer}
  .track i.on{background:var(--accent)}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:12px}
  button{
    font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;border:none;
    border-radius:10px;padding:10px 18px;background:var(--accent);color:#fff;
  }
  button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <h1 id="title">Frame Player</h1>
  <div class="stage">
    <svg viewBox="0 0 300 190" aria-hidden="true">
      <rect x="0" y="150" width="300" height="40" fill="rgba(114,160,125,.18)"/>
      <g id="scene"></g>
    </svg>
    <div class="track" id="track"></div>
  </div>
  <div class="cap" id="cap"></div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Back</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="nextBtn" type="button">Next</button>
  </div>

<script>
  /* A frame chart. Each frame is a caption plus a stage of simple shapes,
     the same idea as Frame Studio: it plays back like a short video. */
  window.__chartParams = window.__chartParams || {
    title: "The Water Cycle",
    accentColor: "#72A07D",
    frameSeconds: 2,
    loop: true,
    frames: [
      "The sun heats the surface of the ocean.",
      "Water evaporates and rises as vapour.",
      "Higher up it cools and condenses into clouds.",
      "The droplets grow heavy and fall as rain.",
      "Runoff carries the water back to the ocean."
    ],
    __schema: {
      accentColor: { type: "color", label: "Accent color" },
      frameSeconds: { type: "slider", label: "Seconds per frame", min: 1, max: 6, step: 1 },
      loop: { type: "toggle", label: "Loop playback" }
    }
  };

  var p = window.__chartParams;
  var accent = p.accentColor || "#72A07D";
  var frames = Array.isArray(p.frames) && p.frames.length ? p.frames : ["Add frames in the params editor"];
  var dur = Math.max(1, +p.frameSeconds || 2) * 1000;

  document.documentElement.style.setProperty("--accent", accent);
  document.getElementById("title").textContent = p.title || "Frame Player";

  var sceneEl = document.getElementById("scene");
  var capEl = document.getElementById("cap");
  var trackEl = document.getElementById("track");
  var playBtn = document.getElementById("play");
  var at = 0, playing = false, tick = null;

  /* Each frame draws a little more of the scene, so playback reads as motion. */
  function scene(n) {
    var out = '<circle cx="252" cy="34" r="17" fill="' + accent + '" opacity="' + (n >= 0 ? 1 : .2) + '"/>';
    if (n >= 1) {
      for (var k = 0; k < 4; k++) {
        var x = 60 + k * 26;
        out += '<path d="M' + x + ' 148 q6 -18 0 -34 q-6 -16 0 -30" fill="none" stroke="' +
               accent + '" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>';
      }
    }
    if (n >= 2) {
      out += '<ellipse cx="118" cy="52" rx="42" ry="20" fill="' + accent + '" opacity=".35"/>' +
             '<ellipse cx="152" cy="46" rx="30" ry="16" fill="' + accent + '" opacity=".28"/>';
    }
    if (n >= 3) {
      for (var j = 0; j < 6; j++) {
        var rx = 86 + j * 18;
        out += '<line x1="' + rx + '" y1="74" x2="' + (rx - 6) + '" y2="' + (104 + (j % 2) * 14) +
               '" stroke="' + accent + '" stroke-width="2.4" stroke-linecap="round"/>';
      }
    }
    if (n >= 4) {
      out += '<path d="M20 150 q40 -22 84 -8 q46 15 92 2 q40 -11 84 6" fill="none" stroke="' +
             accent + '" stroke-width="3" stroke-linecap="round"/>';
    }
    sceneEl.innerHTML = out;
  }

  function show(n) {
    at = (n + frames.length) % frames.length;
    scene(at);
    capEl.textContent = frames[at];
    Array.prototype.forEach.call(trackEl.children, function (b, k) {
      b.className = k <= at ? "on" : "";
    });
  }

  function stop() { playing = false; clearInterval(tick); tick = null; playBtn.textContent = "Play"; }
  function start() {
    playing = true;
    playBtn.textContent = "Pause";
    tick = setInterval(function () {
      if (at + 1 >= frames.length && !p.loop) { stop(); return; }
      show(at + 1);
    }, dur);
  }

  frames.forEach(function (_, k) {
    var b = document.createElement("i");
    b.addEventListener("click", function () { stop(); show(k); });
    trackEl.appendChild(b);
  });

  function bind(el, fn) {
    el.addEventListener("click", fn);
    el.addEventListener("touchstart", function (e) { e.preventDefault(); fn(); }, { passive: false });
  }
  bind(playBtn, function () { playing ? stop() : start(); });
  bind(document.getElementById("prev"), function () { stop(); show(at - 1); });
  bind(document.getElementById("nextBtn"), function () { stop(); show(at + 1); });

  show(0);
</script>
</body>
</html>
